  }

  .filtros button {
    padding: 7px 13px; font-size: .88rem; color: var(--texto);
    background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  .filtros button[aria-pressed="true"] {
    background: var(--acento); border-color: var(--acento); color: #fff; font-weight: 600;
  }
  h2 {
    font-size: .95rem; font-weight: 700; letter-spacing: .02em;
    margin: 24px 0 8px; padding-left: 2px;
  }
  h2 small { font-weight: 400; color: var(--suave); font-size: .82rem; margin-left: 6px; }
  .caja { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; }
  .fila {

    padding: 10px 13px; border-bottom: 1px solid var(--linea);
  }
  .fila:last-child { border-bottom: 0; }
  .prod { min-width: 0; }

  .prod small { color: var(--suave); font-size: .78rem; }
  .est { text-align: right; flex-shrink: 0; }
  .chip {

  .chip.poco { color: var(--poco); background: var(--poco-f); }
  .chip.no { color: var(--no); background: var(--no-f); }
  .chip.susp { color: var(--susp); background: var(--susp-f); }
  .entra { display: block; margin-top: 3px; font-size: .78rem; color: var(--suave); }
  .vacio { padding: 26px 0; text-align: center; color: var(--suave); }
  footer { margin-top: 26px; font-size: .82rem; color: var(--suave); }
  footer p { margin: 6px 0; }

const BAJADO = "2026-10-15T00:34:27";
const TEXTO = {hay: 'Hay', poco: 'Poco', no: 'Sin stock', susp: 'No disponible'};
const lista = document.getElementById('lista');
const buscar = document.getElementById('buscar');
const btnSolo = document.getElementById('soloStock');
const btnTodo = document.getElementById('verTodo');
let soloConStock = false;

(function () {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const b = new Date(BAJADO); b.setHours(0, 0, 0, 0);
  const dias = Math.round((hoy - b) / 86400000);
  const el = document.getElementById('antiguedad');
  if (dias <= 0) el.textContent = 'Actualizado hoy';
  else if (dias === 1) el.textContent = 'Actualizado ayer';
  else el.textContent = 'Hace ' + dias + ' días: puede estar desactualizado';
  if (dias > 3) el.classList.add('viejo');
})();

function escapar(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fila(p) {
  const entra = p.entra ? `<span class="entra">Entra a ${escapar(p.entra)}</span>` : '';
  return `<div class="fila"><div class="prod"><b>${escapar(p.nombre)}</b><small>${escapar(p.codigo)}</small></div>` +
         `<div class="est"><span class="chip ${p.estado}">${TEXTO[p.estado]}</span>${entra}</div></div>`;
}

function pintar() {
  const texto = buscar.value.trim().toLowerCase();
  let html = '';
  for (const s of SECCIONES) {
    const productos = s.productos.filter(p => {
      if (soloConStock && !(p.estado === 'hay' || p.estado === 'poco')) return false;
      if (!texto) return true;
      return (p.nombre + ' ' + p.codigo).toLowerCase().includes(texto);
    });
    if (!productos.length) continue;
    const conStock = productos.filter(p => p.estado === 'hay' || p.estado === 'poco').length;
    html += `<h2>${escapar(s.titulo)}<small>${conStock} de ${productos.length} con stock</small></h2>` +
            `<div class="caja">${productos.map(fila).join('')}</div>`;
  }
  lista.innerHTML = html || '<p class="vacio">No hay productos que coincidan.</p>';
}

buscar.addEventListener('input', pintar);
btnSolo.addEventListener('click', () => {
  soloConStock = true;
  btnSolo.setAttribute('aria-pressed', 'true');
  btnTodo.setAttribute('aria-pressed', 'false');
  pintar();
});
btnTodo.addEventListener('click', () => {
  soloConStock = false;
  btnSolo.setAttribute('aria-pressed', 'false');
  btnTodo.setAttribute('aria-pressed', 'true');
  pintar();
});
pintar();
</script>
